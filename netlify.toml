# TanStack Start (SSR via Nitro) on Netlify
# Build MUST run on Netlify (not drag-and-drop) so the .netlify/functions-internal
# SSR server function generated by Nitro's "netlify" preset gets deployed.
[build]
  command = "bun run build"
  publish = "dist"

# Do NOT add an SPA fallback like `/* -> /index.html`.
# There is no index.html: all routes are server-rendered by the SSR function,
# which registers its own catch-all handler via functions-internal/nitro.json.
